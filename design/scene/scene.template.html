<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nairobi at night: scene test</title>
<style>
@font-face{font-family:'Departure Mono';src:url(data:font/woff2;base64,__FONT__) format('woff2');font-display:block}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#060a1c;color:#f4efd8;font-family:'Departure Mono',ui-monospace,monospace}
.wrap{min-height:100%;display:grid;place-items:center}
.stage{position:relative;overflow:hidden;background:#060a1c}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hud{position:absolute;left:2%;right:2%;top:3%;display:flex;gap:10px;align-items:center;font-size:clamp(10px,1.3vw,16px);pointer-events:none}
.hud .sp{flex:1}
.chip{background:#101030;color:#f4efd8;border:2px solid #f4efd8;padding:.35em .7em;font:inherit;pointer-events:auto}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:#ffe066;color:#101030;border-color:#101030}
.hint{position:absolute;left:2%;bottom:2.5%;font-size:clamp(9px,1.1vw,14px);background:#101030cc;padding:.35em .7em}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:44%;min-width:26%;background:#f4efd8;color:#101030;border:3px solid #101030;box-shadow:4px 4px 0 #101030;padding:.6em .8em;font-size:clamp(10px,1.35vw,18px);line-height:1.3;transition:opacity .15s}
.bubble.off{opacity:0}
.bubble::after{content:'';position:absolute;left:calc(var(--tail,50%) - 7px);bottom:-10px;width:14px;height:14px;background:#f4efd8;border:solid #101030;border-width:0 3px 3px 0;transform:rotate(45deg)}
.bubble .rest{visibility:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
:focus-visible{outline:3px solid #ffe066;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<div class="stage" id="stage">
<canvas id="c" role="img" aria-label="A pixel-art street in Nairobi at night. Six buildings with neon signs: Egerton, Podii, GikTek, Musoni, LexIMS and a post office. Pixel Cecil stands on the pavement."></canvas>
<div class="hud"><span class="chip" id="clock">NAIROBI</span><span class="sp"></span><button class="chip" id="snd" type="button" aria-pressed="false">Sound: off</button></div>
<div class="bubble off" id="bubble" aria-live="polite"><span class="typed"></span><span class="rest"></span></div>
<div class="hint" id="hint">Click a building, or walk with the arrow keys</div>
<nav class="sr" aria-label="Places" id="places"></nav>
</div>
</div>
<script>
(() => {
'use strict';
const VW = 426, H = 240, GY = 200, W = 704;   // the view is 426 wide; the street (W) is wider and the camera follows Cecil
const stage = document.getElementById('stage'), cv = document.getElementById('c');
cv.width = VW; cv.height = H;
const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- helpers ----------
const rng = (s) => () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const dth = (x, y, a) => a * 16 > BAYER[y & 3][x & 3] + 0.5;   // ordered dither: draw this pixel at coverage a?
const layer = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const R = (c, col, x, y, w, h) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
function shade(c, col, x0, y0, x1, y1, alpha) {          // dithered fill; alpha(x,y) returns coverage 0..1
  c.fillStyle = col;
  for (let y = Math.floor(y0); y < y1; y++) for (let x = Math.floor(x0); x < x1; x++) if (dth(x, y, alpha(x, y))) c.fillRect(x, y, 1, 1);
}

// ---------- pixel lettering for the neon signs ----------
const F = { A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', G: '011100101101011', I: '111010010010111', K: '101101110101101', L: '100100100100111', O: '010101101101010', P: '110101110100100', R: '110101110101101', S: '011100010001110', T: '111010010010010', U: '101101101101111', X: '101101010101101',
  M: '1000111011101011000110001', N: '10011101101110011001' };
const glyph = (ch) => { const s = F[ch]; const w = s.length / 5; return { w, at: (cx, cy) => s[cy * w + cx] === '1' }; };
const textW = (t, k) => [...t].reduce((n, ch) => n + (glyph(ch).w + 1) * k, -k);
function text(c, t, x, y, k, col, skip = -1) {
  c.fillStyle = col; let cx = x;
  [...t].forEach((ch, i) => { const gl = glyph(ch);
    if (i !== skip) for (let r = 0; r < 5; r++) for (let q = 0; q < gl.w; q++) if (gl.at(q, r)) c.fillRect(cx + q * k, y + r * k, k, k);
    cx += (gl.w + 1) * k; });
}

// ---------- sky: dithered dusk gradient, moon, stars ----------
const [sky, sk] = layer(VW, H);
const STOPS = [[0, '#060a1c'], [48, '#0a1130'], [88, '#141a48'], [122, '#2a2364'], [148, '#4f2e75'], [170, '#86406f'], [187, '#c96358'], [200, '#f0a25a']];
for (let y = 0; y < GY; y++) {
  let i = 0; while (i < STOPS.length - 2 && y >= STOPS[i + 1][0]) i++;
  const t = (y - STOPS[i][0]) / (STOPS[i + 1][0] - STOPS[i][0]);
  for (let x = 0; x < VW; x++) R(sk, dth(x, y, t) ? STOPS[i + 1][1] : STOPS[i][1], x, y, 1, 1);
}
const MOON = { x: 352, y: 42, r: 13 };
shade(sk, '#2c3273', MOON.x - 34, MOON.y - 34, MOON.x + 34, MOON.y + 34, (x, y) => { const d = Math.hypot(x - MOON.x, y - MOON.y); return d < MOON.r ? 0 : Math.max(0, 0.5 - (d - MOON.r) / 36); });
for (let y = -MOON.r; y <= MOON.r; y++) for (let x = -MOON.r; x <= MOON.r; x++) {
  const d = Math.hypot(x + 0.5, y + 0.5); if (d > MOON.r) continue;
  const lit = Math.hypot(x + 5, y + 5) < MOON.r - 1;
  R(sk, lit ? '#f4efd8' : '#cfc7a6', MOON.x + x, MOON.y + y, 1, 1);
}
[[-6, -4, 3], [3, 2, 2], [-2, 6, 2], [6, -7, 1], [-9, 3, 1]].forEach(([x, y, r]) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (Math.hypot(i, j) <= r) R(sk, '#ddd5b4', MOON.x + x + i, MOON.y + y + j, 1, 1); });
const sr = rng(11);
const stars = Array.from({ length: 120 }, () => ({ x: Math.floor(sr() * VW), y: Math.floor(sr() * sr() * 150), b: 0.35 + sr() * 0.65, sp: 0.6 + sr() * 2.2, ph: sr() * 6.28 }));

// ---------- clouds ----------
function cloud(seed, w, h, body, under) {
  const [c, x] = layer(w, h), r = rng(seed), puffs = [];
  for (let i = 0; i < 6; i++) puffs.push([w * (0.14 + 0.72 * (i / 5)) + (r() - 0.5) * 6, h * (0.5 + (r() - 0.5) * 0.3), w * (0.1 + r() * 0.1), h * (0.26 + r() * 0.2)]);
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    let inside = false, low = false;
    for (const [cx, cy, rx, ry] of puffs) { const d = ((px - cx) / rx) ** 2 + ((py - cy) / ry) ** 2; if (d <= 1) { inside = true; if (py > cy + ry * 0.25) low = true; } }
    if (inside) R(x, low && dth(px, py, 0.75) ? under : body, px, py, 1, 1);
  }
  for (let px = 0; px < w; px++) R(x, 'rgba(0,0,0,0)', px, h - 1, 1, 1);
  return c;
}
const clouds = [
  { img: cloud(3, 96, 18, '#1b2052', '#2c2a6a'), x: 40, y: 62, v: 2.2 },
  { img: cloud(5, 70, 14, '#161b4a', '#262662'), x: 230, y: 30, v: 1.4 },
  { img: cloud(8, 120, 20, '#3a2c70', '#6b3f7c'), x: 300, y: 112, v: 3.1 },
  { img: cloud(9, 84, 16, '#553074', '#96506f'), x: 110, y: 146, v: 3.8 },
];

// ---------- skylines: far (hazy) and middle ----------
const PAD = 14;
function skyline(c, seed, col, o) {
  const r = rng(seed); let x = -PAD;
  while (x < o.span + PAD) {
    const w = o.w[0] + Math.floor(r() * (o.w[1] - o.w[0])), h = o.h[0] + Math.floor(r() * r() * (o.h[1] - o.h[0])), top = GY - h;
    R(c, col, x, top, w, h); R(c, o.edge, x, top, 1, h);
    const k = r();
    if (k < 0.28) R(c, col, x + 3, top - 4, w - 6, 4);
    else if (k < 0.46) { R(c, col, x + (w >> 1), top - 14, 1, 14); o.blink && o.blink.push({ x: x + (w >> 1), y: top - 15, ph: r() * 3 }); }
    else if (k < 0.62) { R(c, col, x + 3, top - 5, 7, 5); R(c, col, x + 4, top - 6, 5, 1); }           // water tank
    else if (k < 0.72) for (let i = 0; i < 6; i++) R(c, col, x + i, top - 6 + i, w - 2 * i, 1);          // sloped cap
    const floorLit = r() < 0.5;
    for (let wy = top + 5; wy < GY - 5; wy += o.win[1] + o.gap[1]) {
      const rowBoost = floorLit && r() < 0.18 ? 0.5 : 0;
      for (let wx = x + 3; wx < x + w - o.win[0] - 1; wx += o.win[0] + o.gap[0])
        if (r() < o.lit + rowBoost) R(c, o.cols[Math.floor(r() * o.cols.length)], wx, wy, o.win[0], o.win[1]);
    }
    x += w + Math.floor(r() * 5) - 1;
  }
}
const blinks = [];
const FW = VW + Math.ceil((W - VW) * 0.25), MW = VW + Math.ceil((W - VW) * 0.5);
const [far, fa] = layer(FW + PAD * 2, H); fa.translate(PAD, 0);
skyline(fa, 21, '#2a2e6c', { span: FW, w: [16, 38], h: [35, 118], edge: '#343a80', win: [1, 1], gap: [3, 4], lit: 0.13, cols: ['#8e8fd6', '#c6a07c', '#8e8fd6'] });
// two Nairobi landmarks, as silhouettes
(function kicc(x) { const top = GY - 142; R(fa, '#2a2e6c', x, top, 18, 142); R(fa, '#343a80', x, top, 1, 142);
  R(fa, '#2a2e6c', x - 9, top + 8, 36, 6); R(fa, '#343a80', x - 9, top + 8, 36, 1); R(fa, '#2a2e6c', x - 5, top + 14, 28, 2);
  R(fa, '#2a2e6c', x + 3, top - 8, 12, 8); R(fa, '#2a2e6c', x - 2, top - 11, 22, 3); R(fa, '#2a2e6c', x + 8, top - 24, 2, 13);
  for (let y = top + 22; y < GY - 6; y += 5) for (let i = 2; i < 16; i += 3) if (((x + y + i) * 7) % 5 < 2) R(fa, '#8e8fd6', x + i, y, 1, 2);
  blinks.push({ x: x + 9 + PAD, y: top - 25, ph: 0.4, layer: 'far' }); })(372);
(function times(x) { const top = GY - 152; R(fa, '#2a2e6c', x, top + 16, 20, 136); R(fa, '#343a80', x, top + 16, 1, 136); R(fa, '#2a2e6c', x + 3, top + 6, 14, 10); R(fa, '#2a2e6c', x + 6, top, 8, 6); R(fa, '#2a2e6c', x + 9, top - 10, 2, 10);
  for (let y = top + 22; y < GY - 6; y += 6) for (let i = 3; i < 17; i += 4) if (((x * 3 + y + i) * 11) % 7 < 2) R(fa, '#c6a07c', x + i, y, 2, 2); })(104);
fa.globalCompositeOperation = 'source-atop';
shade(fa, '#86406f', -PAD, GY - 64, FW + PAD, GY, (x, y) => 0.5 * (y - (GY - 64)) / 64);                 // haze near the horizon
fa.globalCompositeOperation = 'source-over';
const [mid, mi] = layer(MW + PAD * 2, H); mi.translate(PAD, 0);
const midBlink = [];
skyline(mi, 37, '#161a44', { span: MW, w: [28, 58], h: [50, 146], edge: '#20265a', win: [2, 3], gap: [3, 4], lit: 0.2, cols: ['#ffd27a', '#ffb454', '#ffd27a', '#7fd4ff'], blink: midBlink });
mi.globalCompositeOperation = 'source-atop';
shade(mi, '#3a2a66', -PAD, GY - 44, MW + PAD, GY, (x, y) => 0.4 * (y - (GY - 44)) / 44);
mi.globalCompositeOperation = 'source-over';

// ---------- the six places ----------
const P = [
  { id: 'EGERTON', x: 20, w: 104, h: 88, neon: '#7dff9a', kind: 'hall', say: 'Egerton University. Computer Science, 2022 to 2026. I graduate on 27 November.' },
  { id: 'PODII', x: 142, w: 64, h: 104, neon: '#c79bff', kind: 'office', say: 'Podii Consultants. My first desk: six months as a technical intern in 2024.' },
  { id: 'GIKTEK', x: 228, w: 104, h: 132, neon: '#5fe1ff', kind: 'tower', say: 'GikTek. Spring Boot, Angular, Kubernetes, and the dashboards that watch them.' },
  { id: 'MUSONI', x: 356, w: 98, h: 104, neon: '#ff9a5c', kind: 'shop', say: 'Musoni. The loan app I led: Flutter app, backend, staff portal and USSD.' },
  { id: 'LEXIMS', x: 478, w: 96, h: 126, neon: '#ffe066', kind: 'archive', say: 'LexIMS. Audits and ISO compliance, with an intelligence layer I am building.' },
  { id: 'POST', x: 602, w: 76, h: 62, neon: '#ff6b8b', kind: 'post', say: 'The post office. My card lives here. Take one.' },
];
const BODY = '#12163a', HI = '#262d62', LO = '#0a0d26', TRIM = '#2e3670';
const [near, ne] = layer();
const wins = [], wr = rng(77);
for (const b of P) {
  const top = (b.top = GY - b.h);
  b.door = b.kind === 'shop' ? b.x + b.w - 30 : b.x + (b.w >> 1) - 9;
  b.doorX = b.door + 9;
  R(ne, BODY, b.x, top, b.w, b.h); R(ne, HI, b.x, top, 2, b.h); R(ne, LO, b.x + b.w - 5, top, 5, b.h);
  R(ne, TRIM, b.x - 2, top - 3, b.w + 4, 3); R(ne, '#3c4688', b.x - 2, top - 3, b.w + 4, 1);
  R(ne, TRIM, b.x, GY - 46, b.w, 2);
  if (b.kind === 'hall') {
    for (let i = 0; i < 18; i++) R(ne, i === 0 || i === 17 ? TRIM : '#171c48', b.x + 4 + i * 2.6, top - 3 - 18 + i, b.w - 8 - i * 5.2, 1);
    for (let i = 17; i >= 0; i--) { const half = (17 - i) * 2.75 + 2; R(ne, '#171c48', b.x + b.w / 2 - half, top - 21 + (17 - i), half * 2, 1); R(ne, '#3c4688', b.x + b.w / 2 - half, top - 21 + (17 - i), 2, 1); }
    R(ne, TRIM, b.x + (b.w >> 1), top - 40, 1, 20); R(ne, '#7dff9a', b.x + (b.w >> 1) + 1, top - 40, 9, 5); R(ne, '#3fae62', b.x + (b.w >> 1) + 1, top - 37, 9, 2);
    for (const cx of [10, 30, b.w - 34, b.w - 14]) { R(ne, TRIM, b.x + cx, GY - 44, 4, 44); R(ne, '#3c4688', b.x + cx, GY - 44, 1, 44); }
  }
  if (b.kind === 'office') { R(ne, '#0a0d26', b.x + 8, top - 17, 20, 12); R(ne, '#1a2052', b.x + 9, top - 16, 18, 2); R(ne, '#0a0d26', b.x + 10, top - 5, 2, 2); R(ne, '#0a0d26', b.x + 24, top - 5, 2, 2); R(ne, TRIM, b.x + 44, top - 9, 10, 6); }
  if (b.kind === 'tower') {
    R(ne, BODY, b.x + 16, top - 28, b.w - 32, 25); R(ne, HI, b.x + 16, top - 28, 2, 25); R(ne, LO, b.x + b.w - 20, top - 28, 4, 25); R(ne, TRIM, b.x + 14, top - 30, b.w - 28, 2);
    R(ne, BODY, b.x + 34, top - 44, b.w - 68, 14); R(ne, TRIM, b.x + 32, top - 46, b.w - 64, 2);
    R(ne, TRIM, b.x + (b.w >> 1), top - 66, 1, 20); R(ne, TRIM, b.x + (b.w >> 1) - 3, top - 58, 7, 1); R(ne, TRIM, b.x + (b.w >> 1) - 2, top - 52, 5, 1);
    blinks.push({ x: b.x + (b.w >> 1), y: top - 67, ph: 0, layer: 'near' });
    for (let x = b.x + 22; x < b.x + b.w - 26; x += 8) wins.push({ x, y: top - 22, w: 5, h: 7, on: wr() < 0.6, col: '#5fe1ff', tv: false });
  }
  if (b.kind === 'archive') {
    for (let j = 0; j < 20; j++) { const half = Math.round(Math.sqrt(20 * 20 - (19 - j) * (19 - j))); R(ne, '#171c48', b.x + (b.w >> 1) - half, top - 23 + j, half * 2, 1); R(ne, '#3c4688', b.x + (b.w >> 1) - half, top - 23 + j, 2, 1); }
    R(ne, TRIM, b.x + (b.w >> 1), top - 31, 1, 8);
    for (let cx = 6; cx < b.w - 6; cx += 21) { R(ne, '#1a2052', b.x + cx, top + 22, 3, b.h - 68); }
  }
  if (b.kind === 'post') { for (let i = 0; i < 10; i++) R(ne, i === 0 ? '#3c4688' : '#171c48', b.x - 2 + i, top - 13 + i, b.w + 4 - i * 2, 1); R(ne, '#171c48', b.x - 2, top - 4, b.w + 4, 1); }
  if (b.kind === 'shop') {
    for (let i = 0; i < b.w - 8; i++) { const col = Math.floor(i / 7) % 2 ? '#f4efd8' : '#ff9a5c'; R(ne, col, b.x + 4 + i, GY - 54, 1, 7); R(ne, mix(col, '#12163a', 0.35), b.x + 4 + i, GY - 47, 1, (i % 7 === 0 || i % 7 === 6) ? 1 : 2); }
    R(ne, LO, b.x + 8, GY - 40, b.w - 46, 30); R(ne, TRIM, b.x + 7, GY - 41, b.w - 44, 1); R(ne, TRIM, b.x + 7, GY - 10, b.w - 44, 1);
    b.shop = { x: b.x + 9, y: GY - 39, w: b.w - 48, h: 28 };
  }
  // upper windows
  const y0 = top + (b.kind === 'archive' ? 30 : 26), y1 = GY - (b.kind === 'shop' ? 72 : 58);
  for (let y = y0; y <= y1; y += 14) for (let x = b.x + 9; x <= b.x + b.w - 16; x += 12) {
    R(ne, '#090c22', x, y, 7, 9); R(ne, '#1a2156', x, y, 7, 1); R(ne, '#1a2156', x, y, 1, 9);
    wins.push({ x, y, w: 7, h: 9, on: wr() < 0.5, col: ['#ffd27a', '#ffd27a', '#ffb454', '#ffe6a6'][Math.floor(wr() * 4)], tv: wr() < 0.07 });
  }
  // door frame and step
  R(ne, TRIM, b.door - 2, GY - 35, 22, 35); R(ne, '#3c4688', b.door - 2, GY - 35, 22, 1); R(ne, '#3c4688', b.door - 3, GY - 1, 24, 1);
  // sign backing and its glow on the wall
  b.signW = textW(b.id, 2); b.signX = b.x + ((b.w - b.signW) >> 1); b.signY = top + 9;
  R(ne, '#080a1e', b.signX - 4, b.signY - 3, b.signW + 8, 16);
  shade(ne, mix(b.neon, BODY, 0.45), b.signX - 6, b.signY + 13, b.signX + b.signW + 6, b.signY + 21, (x, y) => 0.45 * (1 - (y - b.signY - 13) / 8));
}
// street: pavement, kerb, road, lamps, their light
const [street, st] = layer();
R(st, '#262b56', 0, GY, W, 18); R(st, '#3a4280', 0, GY, W, 1);
for (let x = 0; x < W; x += 16) R(st, '#1d2148', x, GY + 1, 1, 16);
R(st, '#1d2148', 0, GY + 9, W, 1);
R(st, '#3a4280', 0, GY + 17, W, 1); R(st, '#0a0c22', 0, GY + 18, W, 1);
R(st, '#0f1230', 0, GY + 19, W, 21);
shade(st, '#161a3e', 0, GY + 19, W, H, () => 0.25);
for (let x = 6; x < W; x += 30) R(st, '#6e6a52', x, GY + 30, 15, 1);
for (const b of P) shade(st, '#ffd27a', b.doorX - 22, GY + 1, b.doorX + 22, GY + 16, (x, y) => { const t = (y - GY) / 16; return Math.abs(x - b.doorX) < 9 + t * 12 ? 0.55 * (1 - t) : 0; });
const LAMPS = [133, 344, 588];
for (const x of LAMPS) {
  shade(st, '#ffe9a8', x - 34, GY - 54, x + 22, GY + 14, (px, py) => { const t = (py - (GY - 54)) / 68, half = 3 + t * 17; return Math.abs(px - (x - 6)) < half ? 0.2 * (1 - t * 0.5) : 0; });
  shade(st, '#ffe9a8', x - 34, GY + 2, x + 22, GY + 16, (px, py) => (((px - x + 6) / 22) ** 2 + ((py - GY - 8) / 5) ** 2 < 1 ? 0.36 : 0));
  R(st, '#39417c', x, GY - 60, 2, 60); R(st, '#39417c', x - 8, GY - 60, 9, 2); R(st, '#fff3c4', x - 10, GY - 58, 6, 3); R(st, '#39417c', x - 1, GY - 2, 4, 2);
}
R(st, '#c0354f', 596, GY - 13, 7, 13); R(st, '#e35a73', 596, GY - 13, 7, 2); R(st, '#12163a', 597, GY - 9, 5, 1);    // post box

// ---------- pixel Cecil ----------
const sheet = new Image(); sheet.src = 'data:image/png;base64,__SPRITE__';
const SW = 30, SH = 37;
const C = { x: 312, tx: 312, dir: 1, key: 0, mode: 'idle', at: null, waveUntil: 0, step: 0 };

// ---------- matatu, plane ----------
function matatu(c, x, y) {
  x = Math.round(x);
  shade(c, '#fff3c4', x - 46, y + 2, x + 2, y + 16, (px, py) => { const t = (x - px) / 46; return Math.abs(py - (y + 10)) < 2 + t * 6 ? 0.4 * (1 - t) : 0; });
  R(c, '#f4efd8', x + 2, y, 34, 12); R(c, '#f4efd8', x, y + 4, 4, 8); R(c, '#d9d2b4', x + 2, y + 11, 34, 1);
  R(c, '#ff6b8b', x, y + 7, 36, 2); R(c, '#5fe1ff', x + 6, y + 9, 26, 1); R(c, '#ffe066', x + 20, y - 1, 12, 1);
  R(c, '#1a2156', x + 2, y + 2, 5, 4); for (let i = 0; i < 4; i++) R(c, i === 1 ? '#ffd27a' : '#1a2156', x + 9 + i * 6, y + 2, 5, 4);
  R(c, '#fff3c4', x, y + 9, 2, 2); R(c, '#ff3b4f', x + 35, y + 8, 1, 3);
  for (const wx of [6, 26]) { R(c, '#05060f', x + wx, y + 10, 6, 5); R(c, '#05060f', x + wx - 1, y + 11, 8, 3); R(c, '#8e96c9', x + wx + 2, y + 12, 2, 1); }
}
let busX = W + 60, planeX = 90, cam = Math.max(0, Math.min(W - VW, 312 - VW / 2));

// ---------- sound: a few synthesised blips, off until the visitor turns it on ----------
let ac = null, soundOn = false;
function blip(f, d = 0.05, type = 'square', vol = 0.035, to = 0) {
  if (!soundOn || !ac) return;
  try { const t = ac.currentTime, o = ac.createOscillator(), a = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    a.gain.setValueAtTime(vol, t); a.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(a).connect(ac.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) { /* audio is optional */ }
}
const chime = () => [523, 659, 784].forEach((f, i) => setTimeout(() => blip(f, 0.12, 'triangle', 0.05), i * 90));
const snd = document.getElementById('snd');
snd.addEventListener('click', () => {
  soundOn = !soundOn;
  if (soundOn && !ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; } }
  if (soundOn && ac && ac.state === 'suspended') ac.resume();
  snd.setAttribute('aria-pressed', String(soundOn)); snd.textContent = 'Sound: ' + (soundOn ? 'on' : 'off');
  if (soundOn) chime();
});

// ---------- speech bubble ----------
const bubble = document.getElementById('bubble'), typed = bubble.querySelector('.typed'), rest = bubble.querySelector('.rest');
let line = '', lineAt = 0, shown = 0;
function say(t) { line = t; lineAt = performance.now(); shown = 0; bubble.classList.toggle('off', !t); if (still) { typed.textContent = t; rest.textContent = ''; shown = t.length; } }

// ---------- input ----------
let hover = null, mx = 0, mxS = 0, lastAct = performance.now(), nudged = false;
const hint = document.getElementById('hint');
const toArt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * VW + cam, (e.clientY - r.top) / r.height * H]; };
const placeAt = (x, y) => P.find((b) => x >= b.x - 2 && x <= b.x + b.w + 2 && y >= b.top - 46 && y <= GY + 8) || null;
function go(b) { C.tx = b.doorX; C.at = null; C.goal = b; C.mode = 'walk'; say(''); blip(660, 0.04); lastAct = performance.now(); hint.style.display = 'none'; }
cv.addEventListener('pointermove', (e) => { const [x, y] = toArt(e); hover = placeAt(x, y); mx = ((x - cam) / VW) * 2 - 1; cv.style.cursor = hover || (Math.abs(x - C.x) < 14 && y > GY - 26 && y < GY + 14) ? 'pointer' : 'default'; });
cv.addEventListener('pointerleave', () => { hover = null; mx = 0; });
cv.addEventListener('click', (e) => {
  const [x, y] = toArt(e), b = placeAt(x, y);
  if (Math.abs(x - C.x) < 14 && y > GY - 26 && y < GY + 14) { C.waveUntil = performance.now() + 1800; say("That's me. The 16-bit one."); blip(880, 0.06, 'square', 0.03, 1320); lastAct = performance.now(); return; }
  if (b) go(b);
});
addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { C.key = e.key === 'ArrowLeft' ? -1 : 1; C.goal = null; C.mode = 'walk'; say(''); hint.style.display = 'none'; lastAct = performance.now(); e.preventDefault(); } });
addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { C.key = 0; C.tx = C.x; } });
const nav = document.getElementById('places');
P.forEach((b) => { const bt = document.createElement('button'); bt.type = 'button'; bt.textContent = 'Walk to ' + b.id[0] + b.id.slice(1).toLowerCase(); bt.addEventListener('click', () => go(b)); nav.appendChild(bt); });

// ---------- sizing: whole-number pixel scale when there is room ----------
function fit() { const k = Math.min(innerWidth / VW, innerHeight / H), s = k >= 1 ? Math.floor(k) : k; stage.style.width = VW * s + 'px'; stage.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
const clock = document.getElementById('clock');
const tick = () => { try { clock.textContent = 'NAIROBI ' + new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Nairobi' }).format(new Date()); } catch (e) { clock.textContent = 'NAIROBI'; } };
tick(); setInterval(tick, 20000);

// ---------- frame ----------
let last = performance.now(), winAt = 0, flick = { b: null, i: -1, until: 0 }, stepAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  mxS += (mx - mxS) * 0.06; const par = still ? 0 : mxS;

  g.drawImage(sky, 0, 0);
  for (const s of stars) { const b = still ? s.b : s.b * (0.62 + 0.38 * Math.sin(t * s.sp + s.ph)); if (b > 0.3) R(g, b > 0.82 ? '#f4efd8' : b > 0.55 ? '#9aa1d6' : '#4a5190', s.x - par, s.y, 1, 1); }
  for (const c of clouds) { if (!still) c.x += c.v * dt; if (c.x > VW + 10) c.x = -c.img.width - 10; g.drawImage(c.img, Math.round(c.x - par * 2), c.y); }
  if (!still) { planeX += 13 * dt; if (planeX > VW + 400) planeX = -30; }
  R(g, '#f4efd8', planeX, 30, 2, 1); if (Math.floor(t * 1.6) % 2) R(g, '#ff3b4f', planeX - 2, 30, 1, 1);

  const camT = Math.max(0, Math.min(W - VW, C.x - VW / 2)); cam += (camT - cam) * (still ? 1 : 0.07); const cr = Math.round(cam);
  const fx = Math.round(-PAD - cam * 0.25 - par * 2), mxo = Math.round(-PAD - cam * 0.5 - par * 4);
  g.drawImage(far, fx, 0); g.drawImage(mid, mxo, 0);
  for (const b of blinks) if (b.layer === 'far' && Math.sin(t * 2.2 + b.ph) > 0.2) R(g, '#ff3b4f', b.x + fx, b.y, 2, 2);
  for (const b of midBlink) if (Math.sin(t * 1.7 + b.ph) > 0.3) R(g, '#ff3b4f', b.x + PAD + mxo, b.y, 1, 1);

  g.save(); g.translate(-cr, 0);
  g.drawImage(near, 0, 0);
  if (!still && now > winAt) { winAt = now + 500 + Math.random() * 900; const w = wins[Math.floor(Math.random() * wins.length)]; w.on = !w.on; }
  for (const w of wins) if (w.on) {
    const col = w.tv ? (Math.sin(t * 9 + w.x) > 0 ? '#7fd4ff' : '#4fa3d8') : w.col;
    R(g, col, w.x, w.y, w.w, w.h); R(g, '#fff6d6', w.x, w.y, w.w, 1); R(g, mix(col, '#12163a', 0.45), w.x, w.y + w.h - 2, w.w, 2); R(g, mix(col, '#12163a', 0.6), w.x + (w.w >> 1), w.y, 1, w.h);
  }
  if (!still && now > flick.until + 2500 + Math.random() * 4000) { const b = P[Math.floor(Math.random() * P.length)]; flick = { b, i: Math.floor(Math.random() * b.id.length), until: now + 140 }; }
  for (const b of P) {
    const hot = hover === b || C.at === b || C.goal === b;
    if (b.shop) { R(g, '#ffd27a', b.shop.x, b.shop.y, b.shop.w, b.shop.h); R(g, '#fff0b8', b.shop.x, b.shop.y, b.shop.w, 2); R(g, '#c98a4b', b.shop.x, b.shop.y + b.shop.h - 5, b.shop.w, 5);
      for (let x = b.shop.x + 12; x < b.shop.x + b.shop.w; x += 13) R(g, '#12163a', x, b.shop.y, 1, b.shop.h);
      R(g, '#12163a', b.shop.x + 6, b.shop.y + 12, 5, 11); R(g, '#12163a', b.shop.x + 20, b.shop.y + 9, 7, 14); R(g, '#12163a', b.shop.x + 34, b.shop.y + 13, 4, 10); }
    R(g, hot ? '#fff0b8' : '#ffc866', b.door, GY - 33, 18, 32); R(g, hot ? '#ffd27a' : '#d99a45', b.door, GY - 8, 18, 7); R(g, '#12163a', b.door + 8, GY - 33, 2, 32); R(g, '#12163a', b.door + 13, GY - 17, 2, 2);
    const skip = flick.b === b && now < flick.until ? flick.i : -1;
    text(g, b.id, b.signX - 1, b.signY, 2, mix(b.neon, '#080a1e', 0.55), skip); text(g, b.id, b.signX + 1, b.signY, 2, mix(b.neon, '#080a1e', 0.55), skip);
    text(g, b.id, b.signX, b.signY - 1, 2, mix(b.neon, '#080a1e', 0.55), skip); text(g, b.id, b.signX, b.signY + 1, 2, mix(b.neon, '#080a1e', 0.55), skip);
    text(g, b.id, b.signX, b.signY, 2, hot ? '#ffffff' : b.neon, skip);
    if (hot) { g.strokeStyle = b.neon; g.lineWidth = 1; g.setLineDash([3, 3]); g.lineDashOffset = -Math.floor(t * 8); g.strokeRect(b.x - 3.5, b.top - 5.5, b.w + 7, b.h + 5); g.setLineDash([]); }
  }
  for (const b of blinks) if (b.layer === 'near' && Math.sin(t * 2.6 + b.ph) > 0) { R(g, '#ff3b4f', b.x - 1, b.y - 1, 3, 3); R(g, '#ffb0b8', b.x, b.y, 1, 1); }
  g.drawImage(street, 0, 0);

  // Cecil: walk to a door, or follow the arrow keys
  if (C.key) C.tx = Math.max(16, Math.min(W - 16, C.x + C.key * 40));
  const dx = C.tx - C.x, speed = 74;
  let moving = Math.abs(dx) > 0.6;
  if (moving) { C.dir = dx > 0 ? 1 : -1; C.x += Math.sign(dx) * Math.min(Math.abs(dx), speed * dt); if (now > stepAt) { stepAt = now + 150; C.step = (C.step + 1) % 4; if (C.step % 2 === 0) blip(120 + Math.random() * 30, 0.03, 'triangle', 0.03); } }
  else if (C.mode === 'walk') {
    C.mode = 'idle';
    const b = C.goal || P.find((p) => Math.abs(p.doorX - C.x) < 12);
    C.goal = null;
    if (b && C.at !== b) { C.at = b; say(b.say); chime(); }
  }
  if (line && !still) { const n = Math.min(line.length, Math.floor((now - lineAt) / 22)); if (n !== shown) { shown = n; typed.textContent = line.slice(0, n); rest.textContent = line.slice(n); if (n % 3 === 0 && n < line.length) blip(540 + (n * 37) % 180, 0.02, 'square', 0.015); } }
  const talking = line && shown < line.length;
  let f = 0;
  if (moving) f = 3 + C.step; else if (now < C.waveUntil) f = talking ? 9 : 8; else if (talking) f = Math.floor(t * 8) % 2 ? 2 : 0; else f = Math.floor(t * 0.9) % 6 === 5 ? 1 : 0;
  const cy = GY + 13 - 35;
  shade(g, '#0a0c22', C.x - 12, GY + 9, C.x + 12, GY + 15, (x, y) => (((x - C.x) / 11) ** 2 + ((y - GY - 12) / 2.6) ** 2 < 1 ? 0.6 : 0));
  if (sheet.complete) { g.save(); g.translate(Math.round(C.x), cy); if (moving && C.dir < 0) g.scale(-1, 1); g.drawImage(sheet, f * SW, 0, SW, SH, -15, 0, SW, SH); g.restore(); }

  if (!still) { busX -= 52 * dt; if (busX < -520) busX = W + 80; }
  matatu(g, busX, GY + 22);
  g.restore();

  const sx = ((C.x - cr) / VW) * 100;
  bubble.style.left = Math.max(24, Math.min(76, sx)) + '%';
  bubble.style.top = ((cy - 7) / H) * 100 + '%';
  bubble.style.setProperty('--tail', Math.max(8, Math.min(92, 50 + (sx - parseFloat(bubble.style.left)) * 2.2)) + '%');
  if (!nudged && now - lastAct > 9000 && !line) { nudged = true; say('Karibu Nairobi. Pick a building and I will walk you there.'); }
  requestAnimationFrame(frame);
}
say('Karibu. This street is my career so far.');
setTimeout(() => { if (line.startsWith('Karibu. This')) say(''); }, 5200);
requestAnimationFrame(frame);
})();
</script>
